submission:
  title: "CareSentinel: AI-Powered Healthcare Care Gap Detection and Monitoring System"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Healthcare for elderly people often involves a chain of connected steps—consultations, tests, reports, and follow-ups—but a missed step can easily go unnoticed when no one is continuously monitoring the entire journey. Elderly patients living alone, along with their caregivers and healthcare providers, face the risk of these unnoticed care gaps leading to delays or interrupted care

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    CareSentinel creates a living timeline of a patient's healthcare journey
    and compares expected care-process sequences with recorded events. It
    detects missing or delayed steps and provides explainable care-gap alerts
    and AI-powered journey insights.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
                                # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
  key_features:
    - "AI-powered care journey timeline"
    - "Expected vs actual care comparison"
    - "Care-gap and dependency detection"
    - "Explainable care-gap alerts"
    - "AI-powered journey insights"

  tech_stack:
    languages: [Python,HTML,CSS,JavaScript]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: [Flask]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: [IBM watsonx.ai,IBM Granite,IBM Bob]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: [SQLite]                      # e.g., ["PostgreSQL", "Redis"]
    other: [RestAPI,Github Actions]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    CareSentinel goes beyond conventional reminders by understanding the
    expected sequence of care events, detecting where the care journey breaks,
    and explaining the missing care-process step to the user.


  known_limitations: >                 # Optional but recommended — be honest about gaps
    AI runtime analysis requires IBM watsonx.ai credentials. The current
    prototype focuses on healthcare care-process monitoring rather than medical
    diagnosis or treatment decisions. The demonstration uses synthetic patient data
